<!-- rie-knoepfe v1 (12.11.2026): Knopf-Regeln für alle Spiele – gleich große Knöpfe je Gruppe, Schrift nie am Rand, nichts verdeckt die Knöpfe. Steht direkt vor dem Ton-/Automatik-/Musik-Baustein. -->
<style>
button{hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
.rie-mehrzeilig{border-radius:max(12px,1.4vh)!important}
#rieMusik,#rieTon,#rieAuto{transform:translate(var(--rie-dx,0px),var(--rie-dy,0px))!important}
html.rie-knopf-weg #rieMusik,html.rie-knopf-weg #rieTon,html.rie-knopf-weg #rieAuto,.rie-weg{visibility:hidden!important;pointer-events:none!important}
#rieMusik,#rieTon,#rieAuto{transition:opacity .2s}
@media (max-width:700px){
 .opt,.opts{grid-template-columns:minmax(0,1fr)!important}
 .steps{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 .themen{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 .opt>*,.opts>*,.steps>*,.themen>*{min-width:0}
 .seg,.chips,.ctrl,.startrow,.startBtns,.actions{flex-wrap:wrap!important;max-width:100%}
 .seg>button,.chips>button,.ctrl>button,.startrow>button,.startBtns>button,.actions>button{max-width:100%;white-space:normal!important}
}
</style>
<script>
(function(){
 if(window.rieKnoepfe)return; window.rieKnoepfe=1;
 // Gruppen: Knöpfe mit demselben Eltern-Element in diesen Behältern werden gleich groß
 var GRUPPE='.top,.head,.seg,.ctrl,.startrow,.startBtns,.actions,.row,.chips,.pks,.modus,.waseg,.srcTabs,.tiles,.lv,.lvl,nav';
 var KLEIN=/(^|\s)(sm|mini|mini2)(\s|$)/;
 function sichtbar(e){if(!e.offsetParent&&getComputedStyle(e).position!=='fixed')return false;var r=e.getBoundingClientRect();return r.width>1&&r.height>1}
 function hatRahmen(cs){var bg=cs.backgroundColor;var a=!(bg==='transparent'||/rgba\([^)]*,\s*0\)$/.test(bg));return a||parseFloat(cs.borderLeftWidth)>0||cs.backgroundImage!=='none'}
 function angleichen(){
  var cs=document.querySelectorAll(GRUPPE);
  for(var i=0;i<cs.length;i++){
   var c=cs[i];if(c===document.body||!sichtbar(c))continue;
   var k=[];for(var j=0;j<c.children.length;j++){var b=c.children[j];if(b.tagName==='BUTTON'&&!b.id.match(/^rie/))k.push(b)}
   if(k.length<2)continue;
   if(c.classList.contains('row')&&k.length!==c.children.length&&k.length<2)continue;
   var teile={gross:[],klein:[],icon:[]};
   k.forEach(function(b){var tx=(b.innerText||'').trim(),q=b.getBoundingClientRect();var icon=!/[\p{L}\p{N}]/u.test(tx)&&q.height>=q.width*.8;(KLEIN.test(b.className)?teile.klein:(icon?teile.icon:teile.gross)).push(b)});
   var cw=c.clientWidth-parseFloat(getComputedStyle(c).paddingLeft)-parseFloat(getComputedStyle(c).paddingRight);
   var grid=getComputedStyle(c).display.indexOf('grid')>=0;
   ['gross','klein','icon'].forEach(function(t){
    var g=teile[t].filter(sichtbar);if(g.length<2)return;
    g.forEach(function(b){b.style.minWidth='';b.style.minHeight=''});
    var mw=0,mh=0;g.forEach(function(b){var r=b.getBoundingClientRect();mw=Math.max(mw,r.width);mh=Math.max(mh,r.height)});
    g.forEach(function(b){b.style.width='';b.style.flex=''});
    var ccs=getComputedStyle(c),eine=ccs.display.indexOf('flex')>=0&&ccs.flexWrap==='nowrap'&&ccs.flexDirection.indexOf('row')===0;
    if(!grid&&eine&&g.length===k.length){
     // eine Zeile ohne Umbruch (z. B. Filterleiste): wenn möglich alle gleich breit UND passend
     var gap=parseFloat(ccs.columnGap)||0,platz=cw-gap*(g.length-1);
     if(mw*g.length>platz){
      var need=0;g.forEach(function(b){var rg=document.createRange();rg.selectNodeContents(b);var fs=parseFloat(getComputedStyle(b).fontSize);need=Math.max(need,rg.getBoundingClientRect().width+2*Math.max(8,fs*.6)+2)});
      if(need*g.length<=platz){var w2=Math.floor(platz/g.length);g.forEach(function(b){b.style.boxSizing='border-box';b.style.flex='0 0 '+w2+'px';b.style.width=w2+'px';b.style.paddingLeft=b.style.paddingRight='0';b.style.textAlign='center'});mw=-1}
     }
    }
    if(!grid&&mw>0){var w=Math.min(Math.ceil(mw),Math.floor(cw));g.forEach(function(b){b.style.boxSizing='border-box';b.style.minWidth=w+'px'})}
    mh=0;g.forEach(function(b){mh=Math.max(mh,b.getBoundingClientRect().height)});
    g.forEach(function(b){b.style.boxSizing='border-box';b.style.minHeight=Math.ceil(mh)+'px'});
   });
  }
 }
 function rand(){
  var bs=document.querySelectorAll('button');
  for(var i=0;i<bs.length;i++){
   var b=bs[i];if(b.id&&/^rie/.test(b.id))continue;if(!sichtbar(b))continue;
   var cs=getComputedStyle(b);var t=(b.innerText||'').trim();if(t.length<2)continue;
   if(!hatRahmen(cs))continue;
   var fs=parseFloat(cs.fontSize),pl=parseFloat(cs.paddingLeft),pr=parseFloat(cs.paddingRight),pt=parseFloat(cs.paddingTop),pb=parseFloat(cs.paddingBottom);
   var soll=Math.max(8,fs*.6);
   if(pl<soll)b.style.paddingLeft=soll+'px';if(pr<soll)b.style.paddingRight=soll+'px';
   var so=Math.max(3,fs*.25);if(pt<so)b.style.paddingTop=so+'px';if(pb<so)b.style.paddingBottom=so+'px';
   // mehrzeiliger Pillen-Knopf: Ecken weniger rund, damit die Schrift nicht an den Rand stößt
   var lh=parseFloat(cs.lineHeight)||fs*1.25;var innen=b.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
   var rund=parseFloat(cs.borderTopLeftRadius)>=b.clientHeight/2-1;
   if(rund&&innen>lh*1.7)b.classList.add('rie-mehrzeilig');else if(innen<=lh*1.3)b.classList.remove('rie-mehrzeilig');
  }
 }
 // Schwebende Knöpfe (Musik, Ton, Auto, Vollbild) dürfen nichts verdecken
 var INHALT='button,a,input,select,textarea,label,summary,[onclick],[role=button],img,canvas,svg,video';
 function schwebend(){var l=[];['rieMusik','rieTon','rieAuto'].forEach(function(id){var e=document.getElementById(id);if(e)l.push(e)});return l}
 function vollbild(){var r=[];var bs=document.querySelectorAll('button');for(var i=0;i<bs.length;i++){var b=bs[i];if(/Vollbild/.test(b.textContent||'')&&getComputedStyle(b).position==='fixed')r.push(b)}return r}
 function istSchwebend(e,alle){for(var i=0;i<alle.length;i++)if(alle[i]===e||alle[i].contains(e))return true;return false}
 function textHier(e,x,y){for(var n=e.firstChild;n;n=n.nextSibling){if(n.nodeType===3&&n.nodeValue.trim()){var rg=document.createRange();rg.selectNodeContents(n);var rs=rg.getClientRects();for(var k=0;k<rs.length;k++){var q=rs[k];if(x>=q.left-2&&x<=q.right+2&&y>=q.top-2&&y<=q.bottom+2)return true}}}return false}
 function stoesst(el,alle){
  var r=el.getBoundingClientRect();if(r.width<2)return false;
  // Knöpfe und Felder, auch abgeschaltete (pointer-events:none), die sichtbar unter dem schwebenden Knopf liegen
  var kand=document.querySelectorAll('button,a,input,select,textarea,summary,[onclick],[role=button]');
  for(var i=0;i<kand.length;i++){var c=kand[i];if(istSchwebend(c,alle))continue;
   var q=c.getBoundingClientRect();if(q.width<2||q.height<2)continue;
   var l=Math.max(q.left,r.left-4),rr=Math.min(q.right,r.right+4),o=Math.max(q.top,r.top-4),u=Math.min(q.bottom,r.bottom+4);
   if(l>=rr||o>=u)continue;
   var cs=getComputedStyle(c);if(cs.visibility==='hidden'||+cs.opacity<0.05)continue;
   var x=(l+rr)/2,y=(o+u)/2;if(x<0||y<0||x>=innerWidth||y>=innerHeight)continue;
   var st=document.elementsFromPoint(x,y),top=null;
   for(var s=0;s<st.length;s++){if(!istSchwebend(st[s],alle)){top=st[s];break}}
   if(top&&(top===c||c.contains(top)||top.contains(c)))return true;
  }
  var px=[.12,.5,.88],py=[.15,.5,.85];
  for(var a=0;a<3;a++)for(var b2=0;b2<3;b2++){
   var x=r.left+r.width*px[a],y=r.top+r.height*py[b2];if(x<0||y<0||x>=innerWidth||y>=innerHeight)continue;
   var st=document.elementsFromPoint(x,y);
   for(var s=0;s<st.length;s++){var e=st[s];if(istSchwebend(e,alle))continue;
    if(e===document.documentElement||e===document.body)break;
    var cs=getComputedStyle(e);if(cs.pointerEvents==='none'&&!textHier(e,x,y))continue;
    if(e.closest('[aria-hidden=true]'))continue;
    if(e.matches('img,svg,canvas,video')){var er=e.getBoundingClientRect();if(er.width*er.height>innerWidth*innerHeight*.25)continue}
    if(e.matches(INHALT)||e.closest('button,a,label,summary,[onclick],[role=button]')||textHier(e,x,y))return true;
    // Fläche ohne eigenen Inhalt (Karte, Hintergrund): darunter weiter suchen
   }
  }
  return false;
 }
 function setze(dx,dy){var h=document.documentElement.style;h.setProperty('--rie-dx',dx+'px');h.setProperty('--rie-dy',dy+'px')}
 var pos=[0,0];
 function ausweichen(){
  var kn=schwebend(),vb=vollbild(),alle=kn.concat(vb);var h=document.documentElement;
  if(kn.length){
   h.classList.remove('rie-knopf-weg');
   var stoss=function(dx,dy){setze(dx,dy);for(var i=0;i<kn.length;i++)if(stoesst(kn[i],kn))return true;return false};
   // 1. Grundplatz unten links, 2. bisheriger Platz, 3. Suche unten von links nach rechts, dann oben
   var ok=null;
   if(!stoss(0,0))ok=[0,0];else if((pos[0]||pos[1])&&!stoss(pos[0],pos[1]))ok=pos;
   if(!ok){
    setze(0,0);var l=Infinity,r=-Infinity,o=Infinity,u=-Infinity;
    kn.forEach(function(k){var q=k.getBoundingClientRect();l=Math.min(l,q.left);r=Math.max(r,q.right);o=Math.min(o,q.top);u=Math.max(u,q.bottom)});
    var rand=l,breit=r-l,schritt=Math.max(24,innerWidth/60);
    var reihen=[0,-(o-rand)];
    for(var z=0;z<reihen.length&&!ok;z++)for(var dx=schritt;dx<=innerWidth-breit-2*rand+1;dx+=schritt){if(!stoss(dx,reihen[z])){ok=[dx,reihen[z]];break}}
    if(!ok&&!stoss(0,reihen[1]))ok=[0,reihen[1]];
   }
   if(ok){pos=ok;setze(ok[0],ok[1])}else{setze(0,0);pos=[0,0];h.classList.add('rie-knopf-weg')}
  }
  vb.forEach(function(b){b.classList.remove('rie-weg');if(stoesst(b,alle))b.classList.add('rie-weg')});
 }
 // Infos sehen nicht wie Knöpfe aus: Pillen ohne Funktion (z. B. „Bild 1 von 8“, „Stufe ●“) werden zu schlichtem Text
 var geprueft=new WeakSet();
 function farbig(c){var m=c.match(/[\d.]+/g);if(!m)return false;var r=+m[0],g=+m[1],b=+m[2];return Math.max(r,g,b)-Math.min(r,g,b)>60}
 function entknopfen(){
  var es=document.body.querySelectorAll('span,div,p,b,strong,small,em,i');
  for(var i=0;i<es.length;i++){var e=es[i];if(geprueft.has(e))continue;
   var r=e.getBoundingClientRect();if(r.width<2||r.height<2)continue;
   var cs=getComputedStyle(e),bg=cs.backgroundColor;
   if(bg==='transparent'||/rgba\([^)]*,\s*0\)$/.test(bg)||cs.backgroundImage!=='none'||parseFloat(cs.borderTopLeftRadius)<r.height/2-1){geprueft.add(e);continue}
   if(r.height>Math.max(90,innerHeight*.09)||r.width>innerWidth*.5)continue;
   if(parseFloat(cs.paddingLeft)<4||cs.cursor==='pointer'||cs.position==='fixed')continue;
   var tx=(e.innerText||'').trim();if(!tx||tx.length>60)continue;
   if(e.closest('button,a,label,select,summary,[onclick],[role=button],[aria-hidden=true],#rieMusik,#rieTon,#rieAuto'))continue;
   if(e.querySelector('button,a,input,select,textarea,[onclick],[role=button]'))continue;
   var pc=e.parentElement?getComputedStyle(e.parentElement).backgroundColor:'';if(pc===bg)continue;
   geprueft.add(e);
   if(farbig(bg)&&!farbig(cs.color))e.style.color=bg;
   e.style.background='none';e.style.boxShadow='none';e.style.borderColor='transparent';e.classList.add('rie-info');
  }
 }
 var plan=0;
 function los(){plan=0;try{angleichen();rand();entknopfen();ausweichen()}catch(e){}}
 function bald(){if(!plan)plan=setTimeout(los,300)}
 var raf=0;function beimScrollen(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;try{ausweichen()}catch(e){}})}
 window.rieKnoepfeJetzt=los;
 addEventListener('load',los);addEventListener('resize',bald);addEventListener('scroll',beimScrollen,true);
 addEventListener('click',function(){setTimeout(los,60);setTimeout(los,450)},true);
 addEventListener('keydown',function(){setTimeout(los,60)},true);
 if(document.fonts&&document.fonts.ready)document.fonts.ready.then(los);
 new MutationObserver(bald).observe(document.documentElement,{childList:true,subtree:true,characterData:true});
 setInterval(function(){try{ausweichen()}catch(e){}},700);
 setInterval(los,2500);
 if(document.readyState!=='loading')los();else addEventListener('DOMContentLoaded',los);
})();
</script>
